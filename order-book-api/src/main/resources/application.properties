spring.application.name=order-book-api
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/order_book}
spring.datasource.username=${DB_USER:order_book}
spring.datasource.password=${DB_PASSWORD:}
spring.sql.init.mode=never

# Pool de conexoes. 16 por instancia: ~5 conexoes ocupadas em media a 2.500 req/s
# por instancia (Lei de Little, ~2 ms por INSERT), com folga para picos.
spring.datasource.hikari.pool-name=order-book-api
spring.datasource.hikari.maximum-pool-size=16
# Falha rapido sob sobrecarga: 2 s de espera por conexao, e nao 30 s do padrao.
# O cliente recebe 503 e pode reenviar com a mesma chave de idempotencia.
spring.datasource.hikari.connection-timeout=2000
# Sobe mesmo com o Postgres fora do ar: responde 503 e o health fica DOWN ate o
# banco voltar.
spring.datasource.hikari.initialization-fail-timeout=-1

# Health mostra o estado do banco (db: UP/DOWN) sem expor detalhes da conexao.
management.endpoint.health.show-components=always

# JSON estrito: 1.5 num campo inteiro e numero no lugar de enum viram 400, em
# vez de serem convertidos em silencio.
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.datatype.enum.fail-on-numbers-for-enums=true

# Expoe health e as metricas (Prometheus), inclusive as gauges do motor lidas do
# banco (EngineMetrics).
management.endpoints.web.exposure.include=health,prometheus
# /actuator/health mostra tudo, inclusive o componente worker. Um balanceador
# deve usar /actuator/health/api: a API segue aceitando ordens com o Worker
# reiniciando, e nao deve sair do ar por isso.
management.endpoint.health.group.api.include=db,diskSpace,ping

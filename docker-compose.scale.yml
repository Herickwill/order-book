# Override SO PARA O TESTE DE ESCALA: varias instancias da API atras de um nginx.
# O compose padrao (docker-compose.yml) continua com uma API so.
#
#   docker compose -f docker-compose.yml -f docker-compose.scale.yml up --build -d --scale api=4
#
# A porta 8080 passa a ser do nginx; as APIs deixam de publicar porta (quatro
# replicas nao podem dividir a mesma). Exige Docker Compose 2.24+ (!reset).

services:
  api:
    ports: !reset []

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

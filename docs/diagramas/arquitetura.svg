<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="523px" preserveAspectRatio="none" style="width:993px;height:523px;background:#FFFFFF;" version="1.1" viewBox="0 0 993 523" width="993px" zoomAndPan="magnify"><title>Arquitetura: a API s&#243; enfileira, o Worker &#233; o &#250;nico escritor do estado</title><defs/><g><text fill="#000000" font-family="Helvetica" font-size="22" font-weight="bold" lengthAdjust="spacing" textLength="729.2549" x="130.6226" y="36.3125">Arquitetura: a API s&#243; enfileira, o Worker &#233; o &#250;nico escritor do estado</text><!--cluster docker compose--><g id="cluster_docker compose"><rect fill="#FFFFFF" height="458" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="636" x="109" y="56.6191"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="114.3174" x="369.8413" y="72.1816">docker compose</text></g><!--cluster PostgreSQL--><g id="cluster_PostgreSQL"><path d="M203,412.6191 C203,402.6191 380,402.6191 380,402.6191 C380,402.6191 557,402.6191 557,412.6191 L557,496.6191 C557,506.6191 380,506.6191 380,506.6191 C380,506.6191 203,506.6191 203,496.6191 L203,412.6191 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M203,412.6191 C203,422.6191 380,422.6191 380,422.6191 C380,422.6191 557,422.6191 557,412.6191 " fill="none" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="81.4707" x="339.2646" y="438.1816">PostgreSQL</text></g><!--entity Cliente--><g id="elem_Cliente"><ellipse cx="55.8677" cy="80.6191" fill="#FFFFFF" rx="8" ry="8" style="stroke:#000000;stroke-width:1;"/><path d="M55.8677,88.6191 L55.8677,115.6191 M42.8677,96.6191 L68.8677,96.6191 M55.8677,115.6191 L42.8677,130.6191 M55.8677,115.6191 L68.8677,130.6191 " fill="none" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.7354" x="11" y="146.1816">Cliente / rob&#244;</text></g><g id="elem_GMN16"><path d="M753.5,236.6191 L753.5,277.1191 L673.6445,281.1191 L753.5,285.1191 L753.5,325.2666 A0,0 0 0 0 753.5,325.2666 L986.772,325.2666 A0,0 0 0 0 986.772,325.2666 L986.772,246.6191 L976.772,236.6191 L753.5,236.6191 A0,0 0 0 0 753.5,236.6191 " fill="#FFFBEA" style="stroke:#C9B458;stroke-width:1;"/><path d="M976.772,236.6191 L976.772,246.6191 L986.772,246.6191 L976.772,236.6191 " fill="#FFFBEA" style="stroke:#C9B458;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="212.272" x="759.5" y="254.2129">Single Writer: s&#243; esta thread altera</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="211.4531" x="759.5" y="269.9424">ordens, trades e saldos. Sem lock,</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="211.7896" x="759.5" y="285.6719">sem corrida, ordem total garantida</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="208.9331" x="759.5" y="301.4014">pela fila. Unicidade garantida pelo</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="163.0649" x="759.5" y="317.1309">advisory lock do Postgres.</text></g><!--entity API--><g id="elem_API"><rect fill="#FFFFFF" height="53.8789" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="191.7393" x="117" y="254.1191"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="22.3604" x="127" y="277.6816">API</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="171.7393" x="127" y="294.6211">(stateless, 1..N inst&#226;ncias)</text></g><!--entity Worker--><g id="elem_Worker"><rect fill="#E8F1FF" height="70.8184" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="209.1436" x="464.5" y="245.6191"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="48.5762" x="474.5" y="269.1816">Worker</text><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="94.6914" x="474.5" y="286.1211">&#250;nico escritor</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="189.1436" x="474.5" y="303.0605">livro + carteiras em mem&#243;ria</text></g><!--entity Standby--><g id="elem_Standby"><rect fill="#F4F4F4" height="53.8789" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="142.2949" x="498" y="83.6191"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="122.2949" x="508" y="107.1816">Worker em espera</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="66.4863" x="508" y="124.1211">(opcional)</text></g><!--entity Inbox--><g id="elem_Inbox"><rect fill="#FFFFFF" height="49.8789" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="139.792" x="409" y="448.6191"/><rect fill="#FFFFFF" height="49.8789" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="139.792" x="405" y="444.6191"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="73.0146" x="413" y="466.1816">commands</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="123.792" x="413" y="483.1211">(fila de comandos)</text></g><!--entity State--><g id="elem_State"><rect fill="#FFFFFF" height="49.8789" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="170.9434" x="215.5" y="448.6191"/><rect fill="#FFFFFF" height="49.8789" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="170.9434" x="211.5" y="444.6191"/><text fill="#000000" font-family="Helvetica" fon
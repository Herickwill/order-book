# Balanceador do teste de escala (docker-compose.scale.yml). Nao faz parte do
# compose padrao.
#
# "api" e o nome do servico no compose: com --scale api=N, o DNS do Docker
# devolve os N enderecos, o nginx resolve todos ao subir e distribui em
# round-robin. Se o numero de replicas mudar, reinicie o nginx.

worker_processes auto;

events {
    worker_connections 8192;
}

http {
    # Sem log por requisicao: a 5.000 req/s, escrever o access log custa CPU
    # que o teste quer medir na API.
    access_log off;

    upstream api {
        server api:8080;
        # Conexoes reaproveitadas com as APIs; sem isso, cada requisicao abriria
        # uma conexao TCP nova.
        keepalive 256;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}

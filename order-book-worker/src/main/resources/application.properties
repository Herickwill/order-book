spring.application.name=order-book-worker
# Sem servidor web: o Worker nao recebe requisicoes.
spring.main.web-application-type=none
spring.sql.init.mode=never

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/order_book}
spring.datasource.username=${DB_USER:order_book}
spring.datasource.password=${DB_PASSWORD:}

# Uma conexao a vida inteira: o advisory lock que garante um unico Worker
# pertence a ela. max-lifetime=0 desliga a reciclagem periodica do Hikari, que
# trocaria a conexao (e perderia o lock) a cada 30 min.
spring.datasource.hikari.pool-name=order-book-worker
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.max-lifetime=0
# Propriedade do driver, e nao da URL, para valer mesmo com DB_URL customizada:
# reescreve o batch em INSERTs de varias linhas.
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true

# Lote maximo (comandos por transacao) e espera quando a fila esta vazia.
worker.batch-size=500
worker.poll-interval=5ms
